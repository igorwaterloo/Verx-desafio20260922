# Atualização de dependências (ADR-0013): PRs semanais agrupados por ecossistema.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # MassTransit 9 é comercial (ADR-0013): permanecer na linha 8.x.
      - dependency-name: MassTransit*
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directories:
      - /src/app/fluxo-caixa-web
      - /src/app/fluxo-caixa-web/e2e
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      npm:
        patterns: ['*']
    ignore:
      # A versão do TypeScript é definida pelo Angular (Angular 22 exige >=6.0 <6.1):
      # sobe junto com o Angular, via `ng update`.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Versões novas do Angular trazem migrações de código: feitas com `ng update`, não por PR automático.
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@angular-devkit/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /src/api
      - /src/app/fluxo-caixa-web
    schedule:
      interval: weekly
    ignore:
      # Node e .NET só em versões LTS: a troca de versão principal é decisão manual
      # (ex.: Node 26 quando virar LTS), não PR automático para versões "Current".
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/*
        update-types: [version-update:semver-major]
