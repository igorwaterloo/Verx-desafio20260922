server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança em todas as respostas (as locations abaixo não usam add_header,
    # que anularia a herança).
    include /etc/nginx/seguranca/cabecalhos.conf;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Configuração de ambiente: nunca em cache.
    location = /config.json {
        expires -1;
    }

    # Arquivos com hash no nome: cache longo.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas da SPA caem no index.html (sem cache, para publicar novas versões na hora).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
