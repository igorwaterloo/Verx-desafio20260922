# Ambiente local da plataforma Fluxo de Caixa (SaaS): infraestrutura + serviços da aplicação.
# Uso:  cd deploy && cp .env.example .env && docker compose up -d
# Serviços da aplicação são construídos a partir de src/api/Dockerfile (contexto: raiz do repositório).

name: fluxo-caixa

# Telemetria (ADR-0011): traces, métricas e logs via OTLP para o Aspire Dashboard.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRIC_EXPORT_INTERVAL: "5000"

x-restart: &restart
  restart: unless-stopped

services:
  sqlserver:
    <<: *restart
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no deploy/.env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    <<: *restart
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no deploy/.env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    <<: *restart
    image: redis:8.8-alpine
    # Somente cache: sem persistência em disco, com política de descarte LRU.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?defina KEYCLOAK_ADMIN no deploy/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no deploy/.env}
      TENANTS_CLIENT_SECRET: ${TENANTS_CLIENT_SECRET:?defina TENANTS_CLIENT_SECRET no deploy/.env}
      KC_HEALTH_ENABLED: "true"
      # Emissor único (iss) para tokens obtidos pelo navegador e por containers;
      # chamadas internas (JWKS) usam keycloak:8080 via backchannel dinâmico.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-fluxo-caixa.json:/opt/keycloak/data/import/realm-fluxo-caixa.json:ro
    healthcheck:
      # A imagem não tem curl: requisição HTTP em bash puro na porta de gerenciamento (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ \"$$status\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  aspire-dashboard:
    <<: *restart
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # UI
      - "4317:18889"  # OTLP/gRPC

  # ---------------------------------------------------------------------------
  # Serviços da aplicação
  # ---------------------------------------------------------------------------

  # SPA Angular (nginx). URLs públicas: o navegador fala direto com o gateway e o Keycloak.
  web:
    <<: *restart
    image: fluxo-caixa/web:dev
    build:
      context: ../src/app/fluxo-caixa-web
    environment:
      API_URL: http://localhost:8080
      OIDC_AUTHORITY: http://localhost:8081/realms/fluxo-caixa
      OIDC_CLIENT_ID: fluxo-caixa-web
    ports:
      - "4200:8080"
    depends_on:
      gateway:
        condition: service_healthy

  # Entrada única da aplicação (ADR-0009): a SPA e os clientes externos falam só com o gateway.
  gateway:
    <<: *restart
    image: fluxo-caixa/gateway:dev
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      args:
        PROJETO: src/api/Gateway/FluxoCaixa.Gateway/FluxoCaixa.Gateway.csproj
        ASSEMBLY: FluxoCaixa.Gateway
    environment:
      <<: *otel
      # "Docker" (e não Development): os destinos vêm do appsettings.json, com os nomes dos serviços.
      ASPNETCORE_ENVIRONMENT: Docker
      Autenticacao__Authority: http://keycloak:8080/realms/fluxo-caixa
      Autenticacao__EmissorValido: http://localhost:8081/realms/fluxo-caixa
      Autenticacao__RequireHttpsMetadata: "false"
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      tenants-api:
        condition: service_started
      lancamentos-api:
        condition: service_started
      consolidado-api-1:
        condition: service_started
      consolidado-api-2:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && case \"$$status\" in *' 200 '*) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  lancamentos-api:
    <<: *restart
    image: fluxo-caixa/lancamentos-api:dev
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      args:
        PROJETO: src/api/Lancamentos/Lancamentos.Api/Lancamentos.Api.csproj
        ASSEMBLY: Lancamentos.Api
    environment:
      <<: *otel
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Lancamentos: "Server=sqlserver,1433;Database=LancamentosDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: ${RABBITMQ_USER}
      RabbitMq__Senha: ${RABBITMQ_PASSWORD}
      # Metadados/JWKS pelo endereço interno; o emissor dos tokens é o endereço público (KC_HOSTNAME).
      Autenticacao__Authority: http://keycloak:8080/realms/fluxo-caixa
      Autenticacao__EmissorValido: http://localhost:8081/realms/fluxo-caixa
      Autenticacao__RequireHttpsMetadata: "false"
      Database__AplicarMigracoes: "true"
    ports:
      - "5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: &healthcheck-dotnet
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && case \"$$status\" in *' 200 '*) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  tenants-api:
    <<: *restart
    image: fluxo-caixa/tenants-api:dev
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      args:
        PROJETO: src/api/Tenants/Tenants.Api/Tenants.Api.csproj
        ASSEMBLY: Tenants.Api
    environment:
      <<: *otel
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Tenants: "Server=sqlserver,1433;Database=TenantsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: ${RABBITMQ_USER}
      RabbitMq__Senha: ${RABBITMQ_PASSWORD}
      # Admin API do Keycloak pela rede interna, com a conta de serviço fluxo-caixa-tenants.
      Keycloak__Url: http://keycloak:8080
      Keycloak__ClientSecret: ${TENANTS_CLIENT_SECRET}
      Autenticacao__Authority: http://keycloak:8080/realms/fluxo-caixa
      Autenticacao__EmissorValido: http://localhost:8081/realms/fluxo-caixa
      Autenticacao__RequireHttpsMetadata: "false"
      Database__AplicarMigracoes: "true"
      # Registra os tenants de demonstração do realm e publica os planos (quota Pro para o Mercado Demo).
      Demonstracao__SemearTenants: "true"
    ports:
      - "5301:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *healthcheck-dotnet

  consolidado-worker:
    <<: *restart
    image: fluxo-caixa/consolidado-worker:dev
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      args:
        PROJETO: src/api/Consolidado/Consolidado.Worker/Consolidado.Worker.csproj
        ASSEMBLY: Consolidado.Worker
    environment:
      <<: *otel
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Consolidado: "Server=sqlserver,1433;Database=ConsolidadoDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: ${RABBITMQ_USER}
      RabbitMq__Senha: ${RABBITMQ_PASSWORD}
      Redis__Endereco: redis:6379
      # O Worker é o escritor da projeção: aplica as migrations do ConsolidadoDb.
      Database__AplicarMigracoes: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *healthcheck-dotnet

  # Duas réplicas explícitas da Api de leitura (ADR-0010): o Gateway balanceia entre elas com health check.
  consolidado-api-1: &consolidado-api
    <<: *restart
    image: fluxo-caixa/consolidado-api:dev
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      args:
        PROJETO: src/api/Consolidado/Consolidado.Api/Consolidado.Api.csproj
        ASSEMBLY: Consolidado.Api
    environment:
      <<: *otel
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Consolidado: "Server=sqlserver,1433;Database=ConsolidadoDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Redis__Endereco: redis:6379
      Autenticacao__Authority: http://keycloak:8080/realms/fluxo-caixa
      Autenticacao__EmissorValido: http://localhost:8081/realms/fluxo-caixa
      Autenticacao__RequireHttpsMetadata: "false"
    ports:
      - "5201:8080" # acesso direto para depuração; o tráfego da aplicação passa pelo Gateway
    depends_on:
      consolidado-worker:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *healthcheck-dotnet

  consolidado-api-2:
    <<: *consolidado-api
    ports:
      - "5202:8080"

volumes:
  sqlserver-data:
  rabbitmq-data:

networks:
  default:
    name: fluxo-caixa
